[package]
name = "rewind"
version = "0.1.0"
edition = "2024"
description = "Local content-addressed file history foundations"
license = "MIT"

[dependencies]
blake3 = "1"
fastcdc = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
proptest = "1"
