[package]
name = "rewind"
version = "1.0.0"
edition = "2024"
rust-version = "1.89"
description = "Local file history with verified, durable snapshots"
license = "MIT"
repository = "https://github.com/darshanvinay/Rewind"
readme = "README.md"
include = ["src/**", "tests/**", "examples/**", "scripts/*.py", "scripts/capture_profile/*.py", "scripts/capture_profile/*.rs", "docs/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[dependencies]
blake3 = "1"
fastcdc = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
notify = "8"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
proptest = "1"
